<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bulls Paradise | Join Our Trading Community</title>

  <meta
    name="description"
    content="Join Bulls Paradise and connect with our trading community."
  >

  <!-- =========================================================
       META PIXEL
       ========================================================= -->

  <script>
    !function(f,b,e,v,n,t,s)
    {
      if(f.fbq)return;

      n=f.fbq=function()
      {
        n.callMethod ?
        n.callMethod.apply(n,arguments) :
        n.queue.push(arguments)
      };

      if(!f._fbq)f._fbq=n;

      n.push=n;
      n.loaded=!0;
      n.version='2.0';
      n.queue=[];

      t=b.createElement(e);
      t.async=!0;
      t.src=v;

      s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)
    }(
      window,
      document,
      'script',
      'https://connect.facebook.net/en_US/fbevents.js'
    );

    /*
      YOUR META PIXEL ID
    */
    fbq('init', '4427228410877362');

    /*
      Track landing page visit
    */
    fbq('track', 'PageView');
  </script>

  <noscript>
    <img
      height="1"
      width="1"
      style="display:none"
      src="https://www.facebook.com/tr?id=4427228410877362&ev=PageView&noscript=1"
      alt=""
    >
  </noscript>

  <!-- =========================================================
       PAGE STYLE
       ========================================================= -->

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --gold: #d4af37;
      --gold-light: #fff0a0;
      --gold-dark: #8c6b16;
      --black: #050505;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow: hidden;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: #fff;

      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(212,175,55,0.16),
          transparent 32%
        ),
        radial-gradient(
          circle at 10% 90%,
          rgba(212,175,55,0.08),
          transparent 30%
        ),
        #050505;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* =========================================================
       BACKGROUND GRID
       ========================================================= */

    body::before {
      content: "";

      position: fixed;
      inset: 0;

      background-image:
        linear-gradient(
          rgba(212,175,55,0.035) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(212,175,55,0.035) 1px,
          transparent 1px
        );

      background-size: 55px 55px;

      pointer-events: none;
    }

    /* =========================================================
       GLOW
       ========================================================= */

    .glow {
      position: fixed;

      width: 420px;
      height: 420px;

      border-radius: 50%;

      background: rgba(212,175,55,0.08);

      filter: blur(100px);

      pointer-events: none;
    }

    .glow.one {
      top: -180px;
      left: -150px;
    }

    .glow.two {
      right: -180px;
      bottom: -180px;
    }

    /* =========================================================
       PARTICLES
       ========================================================= */

    .particle {
      position: fixed;

      width: 3px;
      height: 3px;

      border-radius: 50%;

      background: var(--gold-light);

      opacity: 0.5;

      animation:
        float 7s infinite ease-in-out;

      pointer-events: none;
    }

    .p1 {
      left: 10%;
      top: 25%;
    }

    .p2 {
      left: 20%;
      top: 70%;
      animation-delay: 2s;
    }

    .p3 {
      left: 80%;
      top: 20%;
      animation-delay: 1s;
    }

    .p4 {
      left: 90%;
      top: 65%;
      animation-delay: 3s;
    }

    .p5 {
      left: 70%;
      top: 80%;
      animation-delay: 4s;
    }

    .p6 {
      left: 35%;
      top: 15%;
      animation-delay: 2.5s;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
        opacity: 0.2;
      }

      50% {
        transform: translateY(-35px);
        opacity: 0.8;
      }

    }

    /* =========================================================
       MAIN CONTAINER
       ========================================================= */

    .container {

      position: relative;
      z-index: 2;

      width: min(92%, 720px);

      padding: 55px 35px;

      text-align: center;

      border:
        1px solid rgba(212,175,55,0.22);

      border-radius: 28px;

      background:
        rgba(10,10,10,0.72);

      backdrop-filter: blur(18px);

      box-shadow:
        0 30px 100px rgba(0,0,0,0.65),
        inset 0 0 40px rgba(212,175,55,0.025);
    }

    /* =========================================================
       BADGE
       ========================================================= */

    .badge {

      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 9px;

      padding: 9px 18px;

      margin-bottom: 28px;

      border:
        1px solid rgba(212,175,55,0.35);

      border-radius: 50px;

      background:
        rgba(212,175,55,0.06);

      color: var(--gold-light);

      font-size: 11px;

      font-weight: 700;

      letter-spacing: 2px;

      text-transform: uppercase;
    }

    .live-dot {

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #4ade80;

      box-shadow:
        0 0 12px #4ade80;

      animation:
        pulse 1.5s infinite;
    }

    @keyframes pulse {

      50% {
        transform: scale(1.5);
        opacity: 0.5;
      }

    }

    /* =========================================================
       BULL
       ========================================================= */

    .bull {

      font-size: 105px;

      line-height: 1;

      margin-bottom: 20px;

      filter:
        drop-shadow(
          0 0 18px rgba(212,175,55,0.5)
        )
        drop-shadow(
          0 0 45px rgba(212,175,55,0.18)
        );

      animation:
        bullMove 3s infinite ease-in-out;
    }

    @keyframes bullMove {

      0%,
      100% {
        transform:
          translateY(0)
          scale(1);
      }

      50% {
        transform:
          translateY(-10px)
          scale(1.04);
      }

    }

    /* =========================================================
       TITLE
       ========================================================= */

    h1 {

      font-size:
        clamp(48px, 10vw, 88px);

      line-height: 0.95;

      font-weight: 900;

      letter-spacing: -4px;

      text-transform: uppercase;

      background:
        linear-gradient(
          120deg,
          var(--gold-dark),
          #fff0a6,
          var(--gold),
          #fff7c7,
          #9b761c
        );

      background-size: 250% auto;

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      animation:
        goldShine 5s linear infinite;
    }

    @keyframes goldShine {

      to {
        background-position:
          250% center;
      }

    }

    /* =========================================================
       SUBTITLE
       ========================================================= */

    .subtitle {

      max-width: 560px;

      margin:
        25px auto 35px;

      color: #999;

      font-size: 17px;

      line-height: 1.7;
    }

    .subtitle strong {
      color: #e6c85c;
    }

    /* =========================================================
       TELEGRAM BUTTON
       ========================================================= */

    .telegram-btn {

      position: relative;

      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 13px;

      min-width: 300px;

      padding: 20px 38px;

      border-radius: 13px;

      text-decoration: none;

      color: #090909;

      background:
        linear-gradient(
          135deg,
          #fff0a0,
          #d4af37,
          #a67c18
        );

      font-size: 17px;

      font-weight: 900;

      letter-spacing: 1px;

      text-transform: uppercase;

      box-shadow:
        0 0 25px rgba(212,175,55,0.25),
        0 15px 40px rgba(0,0,0,0.5);

      overflow: hidden;

      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;

      cursor: pointer;
    }

    .telegram-btn::before {

      content: "";

      position: absolute;

      top: 0;
      left: -100%;

      width: 70%;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,0.6),
          transparent
        );

      transform:
        skewX(-20deg);

      animation:
        buttonShine 3.5s infinite;
    }

    @keyframes buttonShine {

      0% {
        left: -100%;
      }

      45%,
      100% {
        left: 150%;
      }

    }

    .telegram-btn:hover {

      transform:
        translateY(-5px)
        scale(1.03);

      box-shadow:
        0 0 45px rgba(212,175,55,0.45),
        0 20px 50px rgba(0,0,0,0.6);
    }

    .telegram-btn:active {

      transform:
        translateY(-1px)
        scale(0.99);
    }

    .telegram-icon {

      width: 28px;
      height: 28px;

      border-radius: 50%;

      background: #111;

      color: #d4af37;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 14px;

      z-index: 1;
    }

    .button-text {
      z-index: 1;
    }

    /* =========================================================
       BUTTON LOADING STATE
       ========================================================= */

    .telegram-btn.loading {

      pointer-events: none;

      opacity: 0.75;
    }

    .telegram-btn.loading .button-text::after {

      content: "...";

      animation:
        dots 1s infinite;
    }

    @keyframes dots {

      0% {
        content: ".";
      }

      33% {
        content: "..";
      }

      66%,
      100% {
        content: "...";
      }

    }

    /* =========================================================
       FOOTER
       ========================================================= */

    .footer {

      margin-top: 38px;

      color: #444;

      font-size: 11px;

      letter-spacing: 1px;
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 600px) {

      body {
        overflow: hidden;
      }

      .container {

        padding:
          42px 22px;
      }

      .bull {

        font-size: 78px;
      }

      h1 {

        letter-spacing: -2px;
      }

      .subtitle {

        font-size: 15px;
      }

      .telegram-btn {

        width: 100%;

        min-width: 0;

        padding:
          18px 20px;
      }

    }

  </style>

</head>

<body>

  <!-- =========================================================
       BACKGROUND
       ========================================================= -->

  <div class="glow one"></div>
  <div class="glow two"></div>

  <div class="particle p1"></div>
  <div class="particle p2"></div>
  <div class="particle p3"></div>
  <div class="particle p4"></div>
  <div class="particle p5"></div>
  <div class="particle p6"></div>


  <!-- =========================================================
       MAIN CONTENT
       ========================================================= -->

  <main class="container">

    <div class="badge">

      <span class="live-dot"></span>

      Live Trading Community

    </div>


    <div class="bull">
      🐂
    </div>


    <h1>
      Bulls Paradise
    </h1>


    <p class="subtitle">

      Welcome to
      <strong>Bulls Paradise</strong>
      —

      connect with our community
      and stay updated.

    </p>


    <!-- =======================================================
         TRACKED TELEGRAM BUTTON

         IMPORTANT:

         DO NOT put the Telegram invite link here.

         /api/go is your tracking endpoint.
         ======================================================= -->

    <a
      href="/api/go"
      class="telegram-btn"
      id="telegramButton"
      aria-label="Join Bulls Paradise on Telegram"
    >

      <span class="telegram-icon">
        ➤
      </span>

      <span class="button-text">
        Join Bulls Paradise
      </span>

    </a>


    <div class="footer">

      © 2026 BULLS PARADISE
      •
      ALL RIGHTS RESERVED

    </div>

  </main>


  <!-- =========================================================
       TRACKING SCRIPT
       ========================================================= -->

  <script>

    /*
     * Telegram button
     */
    const telegramButton =
      document.getElementById("telegramButton");


    /*
     * When visitor clicks Telegram button:
     *
     * 1. Track Lead in Meta Pixel
     * 2. Keep fbclid / UTM parameters
     * 3. Send visitor to /api/go
     * 4. /api/go creates a unique Telegram invite
     * 5. /api/go redirects to Telegram
     */

    telegramButton.addEventListener(
      "click",
      function(event) {

        /*
         * Stop the normal link temporarily
         */
        event.preventDefault();


        /*
         * Prevent double clicks
         */
        if (
          telegramButton.classList.contains("loading")
        ) {
          return;
        }


        telegramButton.classList.add("loading");


        /*
         * Change button text
         */
        const buttonText =
          telegramButton.querySelector(".button-text");

        buttonText.textContent =
          "Connecting";


        /*
         * META PIXEL EVENT
         *
         * This tells Meta that the visitor
         * clicked the Telegram CTA.
         */

        if (typeof fbq === "function") {

          fbq(
            "track",
            "Lead"
          );

        }


        /*
         * Get the parameters from the landing page.
         *
         * Example:
         *
         * ?fbclid=ABC
         * &utm_source=facebook
         * &utm_medium=paid
         * &utm_campaign=bulls
         *
         * These are sent to /api/go.
         */

        const currentParams =
          new URLSearchParams(
            window.location.search
          );


        /*
         * Build tracking URL
         */

        let trackingUrl =
          "/api/go";


        /*
         * Preserve Meta / UTM parameters
         */

        if (currentParams.toString()) {

          trackingUrl +=
            "?" +
            currentParams.toString();

        }


        /*
         * Give Meta Pixel a short moment
         * to send the event before navigation.
         */

        setTimeout(
          function() {

            window.location.href =
              trackingUrl;

          },
          350
        );

      }
    );

  </script>

</body>
</html>
