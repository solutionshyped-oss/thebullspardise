<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bulls Paradise</title>

  <!-- =========================
       META PIXEL
       ========================= -->
  <script>
    !function(f,b,e,v,n,t,s)
    {
      if(f.fbq)return;
      n=f.fbq=function(){
        n.callMethod ?
        n.callMethod.apply(n,arguments) :
        n.queue.push(arguments)
      };

      if(!f._fbq)f._fbq=n;
      n.push=n;
      n.loaded=!0;

  <!-- =========================
       STYLES
       ========================= -->
  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --gold: #d4af37;
      --gold-light: #fff0a0;
      --gold-dark: #8c6b16;
      --black: #050505;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;

      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(212,175,55,0.16),
          transparent 32%
        ),
        radial-gradient(
          circle at 10% 90%,
          rgba(212,175,55,0.08),
          transparent 30%
        ),
        #050505;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Background grid */

    body::before {
      content: "";
      position: fixed;
      inset: 0;

      background-image:
        linear-gradient(
          rgba(212,175,55,0.035) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(212,175,55,0.035) 1px,
          transparent 1px
        );

      background-size: 55px 55px;
      pointer-events: none;
    }

    /* Ambient glow */

    .glow {
      position: fixed;
      width: 420px;
      height: 420px;

      border-radius: 50%;
      background: rgba(212,175,55,0.08);

      filter: blur(100px);
      pointer-events: none;
    }

    .glow.one {
      top: -180px;
      left: -150px;
    }

    .glow.two {
      right: -180px;
      bottom: -180px;
    }

    /* Floating particles */

    .particle {
      position: fixed;

      width: 3px;
      height: 3px;

      border-radius: 50%;
      background: var(--gold-light);

      opacity: 0.5;

      animation: float 7s infinite ease-in-out;

      pointer-events: none;
    }

    .p1 {
      left: 10%;
      top: 25%;
    }

    .p2 {
      left: 20%;
      top: 70%;
      animation-delay: 2s;
    }

    .p3 {
      left: 80%;
      top: 20%;
      animation-delay: 1s;
    }

    .p4 {
      left: 90%;
      top: 65%;
      animation-delay: 3s;
    }

    .p5 {
      left: 70%;
      top: 80%;
      animation-delay: 4s;
    }

    .p6 {
      left: 35%;
      top: 15%;
      animation-delay: 2.5s;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
        opacity: 0.2;
      }

      50% {
        transform: translateY(-35px);
        opacity: 0.8;
      }
    }

    /* Main container */

    .container {
      position: relative;
      z-index: 2;

      width: min(92%, 720px);

      padding: 55px 35px;

      text-align: center;

      border: 1px solid rgba(212,175,55,0.22);

      border-radius: 28px;

      background: rgba(10,10,10,0.72);

      backdrop-filter: blur(18px);

      box-shadow:
        0 30px 100px rgba(0,0,0,0.65),
        inset 0 0 40px rgba(212,175,55,0.025);
    }

    /* Badge */

    .badge {
      display: inline-flex;

      align-items: center;

      gap: 9px;

      padding: 9px 18px;

      margin-bottom: 28px;

      border: 1px solid rgba(212,175,55,0.35);

      border-radius: 50px;

      background: rgba(212,175,55,0.06);

      color: var(--gold-light);

      font-size: 11px;

      font-weight: 700;

      letter-spacing: 2px;

      text-transform: uppercase;
    }

    .live-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #4ade80;

      box-shadow: 0 0 12px #4ade80;

      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {

      50% {
        transform: scale(1.5);
        opacity: 0.5;
      }

    }

    /* Bull */

    .bull {
      font-size: 105px;

      line-height: 1;

      margin-bottom: 20px;

      filter:
        drop-shadow(
          0 0 18px rgba(212,175,55,0.5)
        )
        drop-shadow(
          0 0 45px rgba(212,175,55,0.18)
        );

      animation: bullMove 3s infinite ease-in-out;
    }

    @keyframes bullMove {

      0%,
      100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-10px) scale(1.04);
      }

    }

    /* Heading */

    h1 {
      font-size: clamp(48px, 10vw, 88px);

      line-height: 0.95;

      font-weight: 900;

      letter-spacing: -4px;

      text-transform: uppercase;

      background: linear-gradient(
        120deg,
        var(--gold-dark),
        #fff0a6,
        var(--gold),
        #fff7c7,
        #9b761c
      );

      background-size: 250% auto;

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      animation: goldShine 5s linear infinite;
    }

    @keyframes goldShine {

      to {
        background-position: 250% center;
      }

    }

    /* Subtitle */

    .subtitle {
      max-width: 560px;

      margin: 25px auto 35px;

      color: #999;

      font-size: 17px;

      line-height: 1.7;
    }

    .subtitle strong {
      color: #e6c85c;
    }

    /* Telegram Button */

    .telegram-btn {

      position: relative;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 13px;

      min-width: 300px;

      padding: 20px 38px;

      border-radius: 13px;

      text-decoration: none;

      color: #090909;

      background: linear-gradient(
        135deg,
        #fff0a0,
        #d4af37,
        #a67c18
      );

      font-size: 17px;

      font-weight: 900;

      letter-spacing: 1px;

      text-transform: uppercase;

      box-shadow:
        0 0 25px rgba(212,175,55,0.25),
        0 15px 40px rgba(0,0,0,0.5);

      overflow: hidden;

      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;

      cursor: pointer;
    }

    .telegram-btn::before {

      content: "";

      position: absolute;

      top: 0;
      left: -100%;

      width: 70%;
      height: 100%;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.6),
        transparent
      );

      transform: skewX(-20deg);

      animation: buttonShine 3.5s infinite;
    }

    @keyframes buttonShine {

      0% {
        left: -100%;
      }

      45%,
      100% {
        left: 150%;
      }

    }

    .telegram-btn:hover {

      transform:
        translateY(-5px)
        scale(1.03);

      box-shadow:
        0 0 45px rgba(212,175,55,0.45),
        0 20px 50px rgba(0,0,0,0.6);
    }

    .telegram-icon {

      width: 28px;
      height: 28px;

      border-radius: 50%;

      background: #111;

      color: #d4af37;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 14px;

      z-index: 1;
    }

    .button-text {
      z-index: 1;
    }

    /* Footer */

    .footer {

      margin-top: 38px;

      color: #444;

      font-size: 11px;

      letter-spacing: 1px;
    }

    /* Mobile */

    @media (max-width: 600px) {

      .container {
        padding: 42px 22px;
      }

      .bull {
        font-size: 78px;
      }

      h1 {
        letter-spacing: -2px;
      }

      .subtitle {
        font-size: 15px;
      }

      .telegram-btn {

        width: 100%;

        min-width: 0;
      }

    }

  </style>

</head>


<body>

  <!-- Background -->

  <div class="glow one"></div>
  <div class="glow two"></div>

  <div class="particle p1"></div>
  <div class="particle p2"></div>
  <div class="particle p3"></div>
  <div class="particle p4"></div>
  <div class="particle p5"></div>
  <div class="particle p6"></div>


  <!-- Main -->

  <main class="container">

    <div class="badge">

      <span class="live-dot"></span>

      Live Trading Community

    </div>


    <div class="bull">
      🐂
    </div>


    <h1>
      Bulls Paradise
    </h1>


    <p class="subtitle">

      Welcome to
      <strong>Bulls Paradise</strong>
      —
      connect with our community and stay updated.

    </p>


    <!--
      IMPORTANT:

      DO NOT PUT YOUR TELEGRAM LINK HERE.

      The button goes to your Meta → Telegram tracker.

      Tracker:
      https://meta-tracker-rho.vercel.app/api/go
    -->

    <a
      id="telegramButton"
      href="https://meta-tracker-rho.vercel.app/api/go"
      class="telegram-btn"
      aria-label="Join Bulls Paradise on Telegram"
    >

      <span class="telegram-icon">
        ➤
      </span>

      <span class="button-text">
        Join Bulls Paradise
      </span>

    </a>


    <div class="footer">

      © 2026 BULLS PARADISE • ALL RIGHTS RESERVED

    </div>

  </main>


  <!-- =========================
       TRACKING SCRIPT
       ========================= -->

  <script>

    /*
      This keeps Meta's tracking parameters.

      Example:

      Meta Ad
        ↓
      Landing Page
        ↓
      ?fbclid=xxxxx
      ?utm_source=facebook
      ?utm_campaign=xxxxx
        ↓
      /api/go
        ↓
      Unique Telegram invite
    */

    const telegramButton =
      document.getElementById("telegramButton");


    if (telegramButton) {

      telegramButton.addEventListener("click", function () {

        /*
          Track the button click in Meta Pixel.
        */

        if (typeof fbq === "function") {

          fbq(
            "track",
            "Lead"
          );

        }


        /*
          Get the current landing-page URL parameters.
        */

        const currentParams =
          new URLSearchParams(
            window.location.search
          );


        /*
          Create tracker URL.
        */

        const trackerUrl =
          new URL(
            "https://meta-tracker-rho.vercel.app/api/go"
          );


        /*
          Copy all UTM / Meta parameters
          from the landing page to /api/go.
        */

        const allowedParameters = [

          "fbclid",

          "utm_source",

          "utm_medium",

          "utm_campaign",

          "utm_content",

          "utm_term"

        ];


        allowedParameters.forEach(function (parameter) {

          const value =
            currentParams.get(parameter);

          if (value) {

            trackerUrl.searchParams.set(
              parameter,
              value
            );

          }

        });


        /*
          Change the button destination
          to the tracker.

          The tracker will then:

          1. Create tracking ID
          2. Create unique Telegram invite
          3. Save click in Redis
          4. Map invite → tracking ID
          5. Redirect user to Telegram
        */

        telegramButton.href =
          trackerUrl.toString();

      });

    }

  </script>


</body>
</html>
